<header class="topbar" [class.is-floor-leaving]="floorMenuTransition === 'leaving'" [class.is-floor-entering]="floorMenuTransition === 'entering'">
  <nav class="nav" aria-label="Navigation principale">
    <button
      type="button"
      class="temperature"
      [class.is-holding]="clockPressActive"
      (pointerdown)="startClockLongPress($event)"
      (pointerup)="cancelClockLongPress()"
      (pointercancel)="cancelClockLongPress()"
      (pointerleave)="cancelClockLongPress()"
      (keydown.enter)="clockLongPress.emit()"
      (contextmenu)="$event.preventDefault()"
      aria-label="Heure actuelle">{{ time }}</button>

    <div class="menu-wrapper" [class.is-floor-leaving]="floorMenuTransition === 'leaving'" [class.is-floor-entering]="floorMenuTransition === 'entering'">
      <button type="button" class="room-trigger" [disabled]="floorChangePending || !visibleItems.length"
        aria-haspopup="dialog" aria-controls="room-picker" [attr.aria-expanded]="roomMenuOpen" (click)="openRoomMenu()">
        <span class="material-symbols-outlined" aria-hidden="true">{{ selectedItem?.icon || 'meeting_room' }}</span>
        <span class="room-trigger-label">{{ selectedItem?.label || 'Choisir une pièce' }}</span>
        <span class="material-symbols-outlined room-trigger-arrow" aria-hidden="true">expand_more</span>
      </button>
    </div>

    <div class="action-cluster">
      <span class="action-chip-slot" [class.is-empty]="!actionChip">
        @if (actionChip) {
          <button
            type="button"
            class="action-chip"
            [class.active]="actionChip.active"
            (click)="onActionChipClick()">
            <span class="action-chip-icon" aria-hidden="true">
              <svg viewBox="0 0 64 64" class="vacuum-pill-icon" focusable="false">
                <ellipse cx="32" cy="24" rx="20" ry="8" />
                <path d="M12 24v12c0 4.4 9 8 20 8s20-3.6 20-8V24" />
                <ellipse cx="32" cy="22" rx="6.5" ry="2.8" />
                <circle cx="23" cy="28" r="1.6" />
                <circle cx="32" cy="29.5" r="1.6" />
                <circle cx="41" cy="28" r="1.6" />
                <path d="M32 44 22 52" />
                <path d="M32 44 42 52" />
              </svg>
            </span>
          </button>
        }
      </span>
      @if (securityAvailable) {
        <button type="button" class="security-chip" [class.active]="securityActive" (click)="securityClick.emit()" aria-label="Ouvrir le centre de sécurité"><span class="material-symbols-outlined">shield</span></button>
      }
        <button type="button" class="floor-badge" [disabled]="floorChangePending" [attr.aria-busy]="floorChangePending" (click)="toggleFloor()" aria-label="Changer d'étage">
          <span class="material-symbols-outlined floor-badge-icon">stairs_2</span>
          <span class="floor-badge-label" [class.floor-transition-a]="floorAnimationAlternate" [class.floor-transition-b]="!floorAnimationAlternate">{{ currentFloorLabel }}</span>
          <span class="material-symbols-outlined floor-badge-arrow">{{ currentFloorArrow }}</span>
        </button>
    </div>
  </nav>
</header>


<dialog #roomDialog id="room-picker" class="room-picker" aria-labelledby="room-picker-title" aria-describedby="room-picker-floor"
  (click)="onRoomBackdropClick($event)" (cancel)="cancelRoomMenu($event)" (close)="roomMenuOpen = false">
  <section class="room-picker-panel">
    <header class="room-picker-header">
      <div><p id="room-picker-floor">{{ currentFloorLabel }}</p><h2 id="room-picker-title">Choisir une pièce</h2></div>
      <button type="button" class="room-picker-close" (click)="closeRoomMenu()" aria-label="Fermer le menu des pièces">
        <span class="material-symbols-outlined" aria-hidden="true">close</span>
      </button>
    </header>
    <div class="room-grid">
        @for (item of visibleItems; track item.value) {
          <button type="button" class="room-card" [class.is-selected]="item.active" [attr.aria-current]="item.active ? 'page' : null" (click)="onItemClick(item)">
            @if (roomBackground(item); as background) {
              <img class="room-card-photo" [src]="background.src" alt="" loading="lazy" decoding="async"
                [style.object-position]="background.positionX + '% ' + background.positionY + '%'" (error)="imageFailed(background.src)">
            } @else {
              <span class="material-symbols-outlined room-card-fallback" aria-hidden="true">{{ item.icon || 'meeting_room' }}</span>
            }
            <span class="room-card-shade" aria-hidden="true"></span>
            <span class="room-card-name">{{ item.label }}</span>
            @if (item.active) { <span class="material-symbols-outlined room-card-check" aria-hidden="true">check</span> }
          </button>
        } @empty { <p class="room-picker-empty">Aucune pièce sur cet étage.</p> }
    </div>
  </section>
</dialog>
